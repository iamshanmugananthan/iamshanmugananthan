<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150" role="img" aria-label="Deployment pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.l{font-size:13px;font-weight:700;fill:#e6edf3}.c{font-size:11px;fill:#8b949e}</style>
<rect x="1" y="1" width="918" height="148" rx="16" fill="url(#bg)" stroke="#30363d"/>
<line x1="30" y1="70" x2="890" y2="70" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></line>
<circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M30,70 H890"/></circle>

<g>
<rect x="20" y="48" width="108" height="44" rx="22" fill="#0d1117" stroke="#58a6ff" stroke-width="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3.5s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="74" y="75" text-anchor="middle" class="l">Git Push</text>
<text x="74" y="116" text-anchor="middle" class="c">code</text>
</g>
