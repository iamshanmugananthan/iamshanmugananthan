<text x="330" y="75" text-anchor="middle" class="l">Build &amp; Test</text>
<text x="330" y="116" text-anchor="middle" class="c">validate</text>
</g>
<g>
<rect x="404" y="48" width="108" height="44" rx="22" fill="#0d1117" stroke="#2496ed" stroke-width="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></rect>
<text x="458" y="75" text-anchor="middle" class="l">Docker</text>
<text x="458" y="116" text-anchor="middle" class="c">container</text>
</g>
<g>
<rect x="532" y="48" width="108" height="44" rx="22" fill="#0d1117" stroke="#a371f7" stroke-width="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3.5s" begin="2.0s" repeatCount="indefinite"/></rect>
<text x="586" y="75" text-anchor="middle" class="l">Load Balancer</text>
